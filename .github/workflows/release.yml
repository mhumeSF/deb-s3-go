---
# yamllint disable rule:line-length
name: Release

# yamllint disable rule:truthy
on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build release artifacts
        run: VERSION="${GITHUB_REF_NAME#v}" mise run build:deb
      - name: Package standalone binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -C dist -czf "dist/deb-s3-go_${version}_linux_amd64.tar.gz" deb-s3_linux_amd64
          tar -C dist -czf "dist/deb-s3-go_${version}_linux_arm64.tar.gz" deb-s3_linux_arm64
      - name: Build OCI image archive
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${GITHUB_REF_NAME#v}" \
            --output "type=oci,dest=dist/deb-s3-go_${GITHUB_REF_NAME#v}_oci.tar" .
      - name: Verify checksums
        run: cd dist && sha256sum --check checksums.txt
      - name: Test amd64 package
        run: |
          mise implode
          sudo apt-get install ./dist/deb-s3-go_*_amd64.deb
          test "$(deb-s3 --version)" = "deb-s3 version ${GITHUB_REF_NAME#v}"
          deb-s3 --help >/dev/null
      - name: Preserve Debian packages as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb
          path: dist/*.deb
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
