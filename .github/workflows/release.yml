---
# yamllint disable rule:line-length
name: Release

# yamllint disable rule:truthy
on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Build release artifacts
        run: VERSION="${GITHUB_REF_NAME#v}" mise run build:deb
      - name: Package standalone binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -C dist -czf "dist/deb-s3-go_${version}_linux_amd64.tar.gz" deb-s3_linux_amd64
          tar -C dist -czf "dist/deb-s3-go_${version}_linux_arm64.tar.gz" deb-s3_linux_arm64
      - name: Append checksums for release-only artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          artifact_names=(
            "deb-s3-go_${version}_linux_amd64.tar.gz"
            "deb-s3-go_${version}_linux_arm64.tar.gz"
          )
          (cd dist && sha256sum "${artifact_names[@]}") >> dist/checksums.txt
      - name: Verify checksums
        run: cd dist && sha256sum --check checksums.txt
      - name: Test amd64 package
        run: |
          mise implode
          sudo apt-get install ./dist/deb-s3-go_*_amd64.deb
          test "$(deb-s3 --version)" = "deb-s3 version ${GITHUB_REF_NAME#v}"
          deb-s3 --help >/dev/null
      - name: Preserve Debian packages as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb
          path: dist/*.deb
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
