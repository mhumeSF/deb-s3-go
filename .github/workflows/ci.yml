---
name: CI

# yamllint disable rule:truthy
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - name: Install GPG for signing tests
        run: sudo apt-get update && sudo apt-get install -y gnupg
      - name: Test
        run: go test ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: Build
        run: go build ./...

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up build tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Build release artifacts
        run: VERSION=0.0.0-ci mise run build:deb
      - name: Verify checksums
        run: cd dist && sha256sum --check checksums.txt
      - name: Inspect Debian packages
        run: |
          dpkg-deb --info dist/deb-s3-go_0.0.0-ci_amd64.deb
          dpkg-deb --info dist/deb-s3-go_0.0.0-ci_arm64.deb
      - name: Install amd64 package
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y ./dist/deb-s3-go_0.0.0-ci_amd64.deb
          test "$(deb-s3 --version)" = "deb-s3 version 0.0.0-ci"

  s3-integration:
    # Forks cannot request AWS credentials; a failed gate prevents auto-merging them.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TEST_BUCKET: meadow-checks-4827
      TEST_PREFIX: ci/${{ github.run_id }}/${{ github.run_attempt }}
    steps:
      - name: Require a branch in this repository
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y gnupg
      - name: Build CLI
        run: go build -o "$RUNNER_TEMP/deb-s3" ./cmd/deb-s3
      - name: Authenticate to test bucket
        id: aws
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::688929843895:role/meadow-checks-ci
          aws-region: us-east-1
          role-session-name: ci-${{ github.run_id }}
          retry-max-attempts: 2
          allowed-account-ids: '688929843895'
      - name: Test S3 and signed APT installation
        run: python3 ci/integration.py --binary "$RUNNER_TEMP/deb-s3" --apt
      - name: Clean up test objects
        if: always() && steps.aws.outcome == 'success'
        run: aws s3 rm "s3://$TEST_BUCKET/$TEST_PREFIX/" --recursive
